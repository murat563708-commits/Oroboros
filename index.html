.logo .oro{width:44px;height:44px;filter:drop-shadow(0 0 8px rgba(170,34,54,.6))}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo .oro{background:linear-gradient(135deg,#8d7d70,#3a2f2a);filter:none}}
.age{display:inline-block;font:700 .68rem/1 var(--sans);letter-spacing:0;color:var(--gold);border:1.5px solid var(--gold);padding:3px 5px}
nav{display:flex;gap:4px}
nav button{position:relative;background:none;border:0;color:var(--muted);font:inherit;font-weight:500;letter-spacing:.02em;cursor:pointer;padding:8px 12px;transition:color .2s}
nav button::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav button.on,nav button:hover{color:var(--text)}
nav button.on::after,nav button:hover::after{transform:scaleX(1)}
#q{margin-left:auto;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--text);padding:8px 4px;font:inherit;width:min(220px,100%);transition:border-color .2s}
#q::placeholder{color:var(--muted)}
#q:focus{outline:none;border-bottom-color:var(--gold)}
.pts{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;color:var(--text);border:0;padding:2px;cursor:pointer;flex:none}
.pts .av{display:grid;place-items:center;width:38px;height:38px;color:#1a0a11;background:linear-gradient(135deg,#e6cc8a,#a9833a);border-radius:50%}
.mini{display:block;width:34px;height:3px;background:rgba(128,128,128,.35);overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}

.hero{--cut:clamp(28px,6vw,56px);position:relative;margin:10px 4vw 0;padding:clamp(28px,7vw,84px) clamp(24px,6vw,72px);min-height:54vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:16px;color:#f1e8d8;
 background:repeating-linear-gradient(135deg,rgba(241,232,216,.05) 0 1px,transparent 1px 6px),radial-gradient(720px 420px at 90% 8%,rgba(210,58,76,.5),transparent 65%),linear-gradient(160deg,#2e101c,#13070c 72%);
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.hero .oro{width:110px;height:110px;filter:drop-shadow(0 0 14px rgba(190,40,60,.55))}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,8vw,6rem);line-height:.98;letter-spacing:-.02em;margin:0;max-width:12ch;text-wrap:balance}
.hero p{margin:0;max-width:42ch;color:rgba(241,232,216,.8);line-height:1.6}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;padding:13px 26px;font:inherit;font-weight:600;letter-spacing:.02em;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:filter .2s}
.btn:hover{filter:brightness(1.12)}
.play{background:#f1e8d8;color:#1a0a11}
.more{background:rgba(241,232,216,.1);color:#f1e8d8;box-shadow:inset 0 0 0 1px rgba(200,164,92,.6)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:24px 4vw 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;color:var(--muted);border:0;padding:9px 18px;font:inherit;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));transition:color .2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);color:#fff;box-shadow:none}

section{padding:34px 0 0 4vw}
h2{display:flex;align-items:center;gap:16px;font-family:var(--serif);font-weight:500;font-size:1.6rem;letter-spacing:-.01em;margin:0 0 14px;padding-right:4vw}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.row{display:flex;gap:16px;overflow-x:auto;padding:6px 4vw 18px 0;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{position:relative;flex:0 0 172px;aspect-ratio:2/3;border:0;padding:16px;color:#f1e8d8;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;font:inherit;scroll-snap-align:start;overflow:hidden;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%);transition:transform .2s}
.card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 5px),linear-gradient(to top,rgba(10,4,7,.88),rgba(10,4,7,.08) 62%);pointer-events:none}
.card::after{content:attr(data-l);position:absolute;right:-2px;top:12px;font:italic 500 7.5rem/1 var(--serif);color:rgba(255,255,255,.14);pointer-events:none}
.card:hover{transform:translateY(-4px)}
.card b{position:relative;font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.card small{position:relative;opacity:.82;margin-top:6px;font-size:.78rem}
.card .age{position:absolute;top:10px;left:10px;color:#fff;border-color:rgba(255,255,255,.75);background:rgba(10,4,7,.5)}
.seen{position:absolute;top:36px;left:10px;background:var(--gold);color:#1a0a11;font:700 .66rem/1 var(--sans);padding:4px 6px}
.empty{color:var(--muted);padding:8px 0}

dialog{border:0;padding:0;max-width:min(560px,92vw);width:100%;background:var(--surface);color:var(--text);clip-path:polygon(0 0,calc(100% - 36px) 0,100% 36px,100% 100%,36px 100%,0 calc(100% - 36px))}
dialog::backdrop{background:rgba(10,4,7,.74);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h2::after{display:none}
.mh{position:relative;isolation:isolate;height:200px;display:flex;align-items:flex-end;padding:20px 26px;color:#f1e8d8;font-family:var(--serif);font-size:2.3rem;font-weight:600;line-height:1}
.mh::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 1px,transparent 1px 5px),linear-gradient(to top,rgba(10,4,7,.7),transparent 70%)}
.mb{padding:20px 26px 30px;display:flex;flex-direction:column;gap:12px}
.mb p{margin:0;color:var(--muted);line-height:1.65}
.mb .btns{margin-top:6px}
.mb .play{background:var(--accent);color:#fff}
.mb .more{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.bar{height:6px;background:rgba(128,128,128,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}

footer{position:relative;padding:52px 4vw 60px;color:var(--muted);font-size:.85rem;text-align:center}
footer::before{content:"";display:block;height:1px;max-width:520px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a0a11;padding:11px 22px;font-weight:700;opacity:0;transition:opacity .3s,transform .3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
#toast.on{opacity:1;transform:translateX(-50%)}

#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 42%,#5a1220 0,#2a0a12 42%,var(--bg) 78%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--text);transition:opacity .6s,visibility .6s;cursor:pointer}
#intro.off{opacity:0;visibility:hidden}
#intro .oro{width:min(60vw,280px);height:min(60vw,280px);animation:fade .9s ease both;filter:drop-shadow(0 0 26px rgba(190,40,60,.5))}
#intro span{font-family:var(--serif);font-size:clamp(2.4rem,9vw,4rem);font-weight:500;letter-spacing:.02em;animation:fade .9s ease both}
#intro span::after{content:"";display:block;height:1px;width:60%;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#chat{display:none;margin:10px 4vw 0;grid-template-columns:190px 1fr 190px;height:min(72vh,640px);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);clip-path:polygon(0 0,calc(100% - 32px) 0,100% 32px,100% 100%,32px 100%,0 calc(100% - 32px))}
.chatmode #chat{display:grid}.chatmode .hero,.chatmode .chips,.chatmode #rows{display:none}
#chl,#chp{padding:16px 10px;overflow:auto;background:rgba(0,0,0,.18)}
#chl h3,#chp h3{margin:0 8px 10px;font:600 .8rem var(--sans);color:var(--muted)}
.chb{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:inherit;padding:8px 10px;cursor:pointer}
.chb:hover{color:var(--text)}.chb.on{color:var(--text);background:rgba(200,164,92,.14);box-shadow:inset 2px 0 0 var(--gold)}
#chp .chb{cursor:default}
.cm{display:flex;flex-direction:column;min-width:0}
.ch{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:14px 20px;box-shadow:0 1px 0 var(--line)}.ch b{font-family:var(--serif);font-size:1.25rem}.ch span{color:var(--muted);font-size:.8rem}
#msgs{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.m{display:flex;gap:12px}.av2{flex:none;width:36px;height:36px;display:grid;place-items:center;font-weight:700;color:#1a0a11;border-radius:50%}
.m b{font-size:.92rem}.m time{color:var(--muted);font-size:.72rem;margin-left:8px}.m p{margin:2px 0 0;overflow-wrap:anywhere;line-height:1.45}
.del{margin-left:8px;background:none;border:0;color:var(--muted);font-size:.72rem;cursor:pointer}
.cc{display:flex;gap:10px;padding:14px 20px;box-shadow:0 -1px 0 var(--line)}
.cc input{flex:1;min-width:0;background:rgba(0,0,0,.2);border:0;box-shadow:inset 0 0 0 1px var(--line);color:var(--text);padding:11px 14px;font:inherit}
.cc input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--gold)}
@media (max-width:760px){#chat{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:78vh}#chp{display:none}#chl{display:flex;overflow-x:auto;padding:8px}.chb{width:auto;white-space:nowrap}#chl h3{display:none}}
.lf{max-width:320px;width:100%;margin:auto;display:flex;flex-direction:column;gap:10px}
.in{background:rgba(0,0,0,.2);border:0;box-shadow:inset 0 0 0 1px var(--line);color:var(--text);padding:11px 14px;font:inherit}
.in:focus{outline:none;box-shadow:inset 0 0 0 1px var(--gold)}
.lf .btn{width:100%}.pav{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:700 1.6rem var(--sans);color:#1a0a11;background:linear-gradient(135deg,#e6cc8a,#a9833a);margin-bottom:8px}#acc .btn{margin:6px 8px 0 0}.mb .lf{margin:0;max-width:none}.tag{color:var(--gold);font-size:.7rem;margin-left:6px}
.sb{background:none;border:0;color:var(--muted);font-size:.72rem;cursor:pointer;margin-left:6px}.sb:hover{color:var(--text)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.card,.btn,nav button::after{transition:none}#intro .oro,#intro span{animation:none}}
</style>

}catch(e){console.error(e)}

 /* ===== YAMA v24: video izle ile baslar, kapaninca durur + seffaf ses kontrolu ===== */
(function(){
try{
  var VID="r2Im3h6u5kI",ZOOM=1.04;
  var POSTER="https://img.youtube.com/vi/"+VID+"/maxresdefault.jpg";
  var h=document.querySelector(".hero"),vp=h&&h.querySelector(".vp");
  if(!h||!vp)return;

  /* eski iframe, ses kutusu ve oynat/durdur butonlari kaldirilir */
  Array.prototype.forEach.call(vp.querySelectorAll("iframe"),function(x){x.remove()});
  Array.prototype.forEach.call(h.querySelectorAll(".sb,.pzb,.pzi"),function(x){x.remove()});

  /* kapak fotosu */
  var pst=vp.querySelector(".pst");
  if(!pst){
    pst=document.createElement("img");pst.className="pst";pst.alt="";pst.src=POSTER;
    pst.onerror=function(){pst.onerror=null;pst.src="https://img.youtube.com/vi/"+VID+"/hqdefault.jpg"};
    vp.insertBefore(pst,vp.firstChild);
  }
  var tg=document.createElement("div");tg.id="ytbg2";vp.appendChild(tg);

  /* seffaf ses kontrolu */
  var box=document.createElement("div");
  box.className="sb2";
  box.innerHTML='<button type="button" aria-label="Ses">🔊</button><input type="range" min="0" max="100" value="70" aria-label="Ses seviyesi">';
  vp.appendChild(box);
  var btn=box.querySelector("button"),rng=box.querySelector("input");
  ["click","touchend","pointerup"].forEach(function(ev){box.addEventListener(ev,function(e){e.stopPropagation()})});

  var player=null,ready=false,want=h.classList.contains("zm"),chk=0,f=null;

  function fit(){
    if(!f)return;
    var W=h.clientWidth,H=h.clientHeight;
    if(!W||!H)return;
    var w=Math.max(W,H*2.4)*ZOOM;
    f.style.width=w+"px";f.style.height=(w*9/16)+"px";
  }
  function sync(){
    try{btn.textContent=(player.isMuted()||player.getVolume()===0)?"🔇":"🔊"}catch(e){}
  }
  function open(){
    want=true;
    if(!ready)return;
    try{player.unMute();player.setVolume(+rng.value);player.playVideo()}catch(e){}
    clearTimeout(chk);
    /* ses ile baslamazsa (ozellikle iPhone) sessiz baslat, ses butonuyla acilir */
    chk=setTimeout(function(){
      try{
        var s=player.getPlayerState();
        if(want&&(s===-1||s===5||s===2)){player.mute();player.playVideo();sync()}
      }catch(e){}
    },1200);
  }
  function close(){
    want=false;clearTimeout(chk);
    try{player.pauseVideo()}catch(e){}
    vp.classList.remove("vplay");
  }

  btn.onclick=function(){
    if(!player)return;
    try{
      if(player.isMuted()||+rng.value===0){
        if(+rng.value===0)rng.value=70;
        player.unMute();player.setVolume(+rng.value);
      }else player.mute();
    }catch(e){}
    sync();
  };
  rng.oninput=function(){
    if(!player)return;
    try{
      player.setVolume(+rng.value);
      if(+rng.value>0&&player.isMuted())player.unMute();
    }catch(e){}
    sync();
  };

  function mk(){
    player=new YT.Player("ytbg2",{
      videoId:VID,
      playerVars:{autoplay:0,controls:0,rel:0,modestbranding:1,iv_load_policy:3,cc_load_policy:0,disablekb:1,fs:0,playsinline:1,loop:1,playlist:VID,origin:location.origin},
      events:{
        onReady:function(){
          ready=true;f=player.getIframe();fit();
          try{player.mute();player.setVolume(+rng.value)}catch(e){}
          sync();
          if(want)open();
        },
        onStateChange:function(e){
          if(e.data===1){
            if(want)vp.classList.add("vplay");
            else{try{player.mute();player.pauseVideo()}catch(x){}} /* izle'ye basilmadan baska kod baslatirsa durdur */
          }
          sync();
        }
      }
    });
  }
  function load(){
    if(window.YT&&YT.Player){mk();return}
    var prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=function(){try{prev&&prev()}catch(e){}mk()};
    if(!document.querySelector('script[src*="iframe_api"]')){
      var s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);
    }
  }
  load();

  /* tam ekran acilinca oynat, kapaninca durdur */
  var was=h.classList.contains("zm");
  new MutationObserver(function(){
    var now=h.classList.contains("zm");
    if(now===was)return;
    was=now;
    if(now)open();else close();
  }).observe(h,{attributes:true,attributeFilter:["class"]});

  window.addEventListener("resize",fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(h);

  var st=document.createElement("style");
  st.textContent=
   ".hero .vp .pst{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.3);pointer-events:none;transition:opacity 1s}"+
   ".hero .vp:not(.vplay) .pst{opacity:1!important}"+
   ".hero .vp.vplay .pst{opacity:0!important}"+
   ".hero .vp iframe{transition:opacity 1s}"+
   ".hero .vp:not(.vplay) iframe{opacity:0!important}"+
   ".hero .vp.vplay iframe{opacity:.6!important}"+
   ".hero.zm .vp.vplay iframe{opacity:1!important}"+
   ".hero .sb2{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;display:none;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);opacity:.55;transition:opacity .2s}"+
   ".hero .sb2:hover,.hero .sb2:focus-within,.hero .sb2:active{opacity:1}"+
   ".hero.zm .sb2{display:flex}"+
   ".hero .sb2 button{background:none;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:4px}"+
   ".hero .sb2 input{width:90px;cursor:pointer;accent-color:#f3e9d8}"+
   "@media(max-width:700px){.hero .sb2{right:12px}.hero .sb2 input{width:70px}}";
  document.head.appendChild(st);
}catch(e){console.error(e)}
})();
 /* ===== YAMA v25: yuvarlak mikrofon ac/kapa ===== */
(function(){
try{
  var streams=[],on=true;
  var md=navigator.mediaDevices;
  if(md&&md.getUserMedia&&!md.__oroHook){
    var orig=md.getUserMedia.bind(md);
    md.getUserMedia=function(c){
      return orig(c).then(function(s){
        if(s.getAudioTracks().length){
          streams.push(s);
          s.getAudioTracks().forEach(function(t){t.enabled=on});
        }
        return s;
      });
    };
    md.__oroHook=1;
  }

  var b=document.createElement("button");
  b.type="button";b.className="micr";b.setAttribute("aria-label","Mikrofon");
  b.innerHTML='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><line class="sl" x1="4" y1="4" x2="20" y2="20"/></svg>';
  document.body.appendChild(b);

  b.onclick=function(){
    on=!on;
    streams.forEach(function(s){s.getAudioTracks().forEach(function(t){t.enabled=on})});
    b.classList.toggle("off",!on);
  };

  var st=document.createElement("style");
  st.textContent=
   ".micr{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:99990;display:none;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;border:1px solid rgba(243,233,216,.5);background:#f3e9d8;color:#12060c;cursor:pointer;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.4)}"+
   ".micr.show{display:flex}"+
   ".micr .sl{display:none}"+
   ".micr.off{background:#a3202f;color:#fff;border-color:#a3202f}"+
   ".micr.off .sl{display:block}";
  document.head.appendChild(st);

  /* eski mikrofon secici / seviye cubugunu gizle (adi mic ile baslayan elemanlar) */
  var re=/(^|[-_\s])mic/i;
  function tick(){
    streams=streams.filter(function(s){return s.getAudioTracks().some(function(t){return t.readyState==="live"})});
    b.classList.toggle("show",streams.length>0);
    document.querySelectorAll("[id],[class]").forEach(function(el){
      if(el===b||b.contains(el)||el.contains(b))return;
      var k=(el.id||"")+" "+((el.getAttribute("class")||""));
      if(re.test(k)&&!/micr/.test(k))el.style.display="none";
    });
  }
  setInterval(tick,700);
}catch(e){console.error(e)}
})();
</script>
